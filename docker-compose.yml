services:
  app:
    build: .
    image: rtl-admin-demo:latest
    ports:
      - "8080:80"
    environment:
      APP_URL: http://localhost:8080
      SANCTUM_STATEFUL_DOMAINS: localhost:8080,127.0.0.1:8080
      # Set to "false" for a real deployment; seeds only an empty database.
      DEMO_SEED: "true"
      # Behind a reverse proxy, set its IP/CIDR so rate limits see real client IPs.
      # TRUSTED_PROXIES: 172.16.0.0/12
      # APP_KEY: set your own; otherwise one is generated once and kept in the volume.
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
